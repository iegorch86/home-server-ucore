---
name: Build signed Home Server uCore images

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 3 * * 6'  # Saturday at 3:45am UTC (approx 60 minutes after uCore images run)
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: "Build and push ${{ matrix.image_name }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: home-server-ucore
            ucore_image: ghcr.io/ublue-os/ucore:lts

          - image_name: home-server-ucore-hci
            ucore_image: ghcr.io/ublue-os/ucore-hci:lts

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        shell: bash
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> "${GITHUB_ENV}"

      - name: Default Tag
        id: gen-default-tag
        shell: bash
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Prepare environment
        shell: bash
        run: |
          registry="${IMAGE_REGISTRY,,}"
          image_name="${IMAGE_NAME,,}"

          echo "IMAGE_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${image_name}" >> "${GITHUB_ENV}"
          echo "UCORE_IMAGE=${{ matrix.ucore_image }}" >> "${GITHUB_ENV}"
          echo "IMAGE_REPOSITORY=${registry}/${image_name}" >> "${GITHUB_ENV}"

          echo "Building:"
          echo "  Upstream: ${{ matrix.ucore_image }}"
          echo "  Output:   ${registry}/${image_name}:${DEFAULT_TAG}"

      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${DEFAULT_TAG}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          for tag in ${ALIAS_TAGS}; do
            podman push \
              --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # Use old bundle format for rpm-ostree/container-libs compatibility.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
  release:
    name: Publish GitHub release
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install release tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Login to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          max_attempts=5

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin; then
              break
            fi

            if ((attempt == max_attempts)); then
              echo "GHCR login failed after ${max_attempts} attempts."
              exit 1
            fi

            delay=$((15 * 2 ** (attempt - 1)))
            echo "GHCR login attempt ${attempt} failed; retrying in ${delay} seconds."
            sleep "${delay}"
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source image-template.env

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="$(git rev-parse --short HEAD)"

          # The Justfile already publishes tags in this format:
          # lts-YYYYMMDD-<git-sha>
          #
          # Find the exact tag produced by this workflow rather than
          # independently guessing the build date.
          release_pattern="^${DEFAULT_TAG}-[0-9]{8}-${short_sha}$"

          list_tags_with_retry() {
            local repository="$1"
            local max_attempts=5
            local attempt
            local delay

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if skopeo list-tags "docker://${registry}/${repository}"; then
                return 0
              fi

              if ((attempt == max_attempts)); then
                echo "Could not list tags for ${repository} after ${max_attempts} attempts." >&2
                return 1
              fi

              delay=$((15 * 2 ** (attempt - 1)))
              echo "Tag lookup for ${repository} failed; retrying in ${delay} seconds." >&2
              sleep "${delay}"
            done
          }

          find_release_tag() {
            local repository="$1"

            list_tags_with_retry "${repository}" \
              | jq -r --arg pattern "${release_pattern}" \
                  '.Tags[]? | select(test($pattern))' \
              | sort \
              | tail -n 1
          }

          ucore_tag="$(find_release_tag "home-server-ucore")"
          hci_tag="$(find_release_tag "home-server-ucore-hci")"

          if [[ -z "${ucore_tag}" ]]; then
            echo "Could not find release tag for home-server-ucore."
            exit 1
          fi

          if [[ -z "${hci_tag}" ]]; then
            echo "Could not find release tag for home-server-ucore-hci."
            exit 1
          fi

          if [[ "${ucore_tag}" != "${hci_tag}" ]]; then
            echo "Image release tags do not match:"
            echo "  uCore:     ${ucore_tag}"
            echo "  uCore HCI: ${hci_tag}"
            exit 1
          fi

          release_tag="${ucore_tag}"

          build_date="${release_tag#${DEFAULT_TAG}-}"
          build_date="${build_date%-${short_sha}}"

          release_date="${build_date:0:4}-${build_date:4:2}-${build_date:6:2}"

          ucore_current="${registry}/home-server-ucore:${DEFAULT_TAG}"
          hci_current="${registry}/home-server-ucore-hci:${DEFAULT_TAG}"

          ucore_release="${registry}/home-server-ucore:${release_tag}"
          hci_release="${registry}/home-server-ucore-hci:${release_tag}"

          ucore_digest="$(
            skopeo inspect \
              --format '{{.Digest}}' \
              "docker://${ucore_release}"
          )"

          hci_digest="$(
            skopeo inspect \
              --format '{{.Digest}}' \
              "docker://${hci_release}"
          )"

          if [[ ! "${ucore_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid uCore digest: ${ucore_digest}"
            exit 1
          fi

          if [[ ! "${hci_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid uCore HCI digest: ${hci_digest}"
            exit 1
          fi

          release_title="Home Server uCore LTS - ${release_date}"

          cat > /tmp/release-notes.md <<EOF_NOTES
          ## Home Server uCore LTS

          Signed Home Server uCore images built from the current upstream uCore LTS images.

          ### uCore

          Current LTS image:

          \`\`\`text
          ${ucore_current}
          \`\`\`

          Release-specific image:

          \`\`\`text
          ${ucore_release}
          \`\`\`

          Published digest:

          \`\`\`text
          ${ucore_digest}
          \`\`\`

          ### uCore HCI

          Current LTS image:

          \`\`\`text
          ${hci_current}
          \`\`\`

          Release-specific image:

          \`\`\`text
          ${hci_release}
          \`\`\`

          Published digest:

          \`\`\`text
          ${hci_digest}
          \`\`\`

          ### Switching to the images

          Standard uCore:

          \`\`\`bash
          sudo bootc switch ${ucore_current}
          \`\`\`

          uCore HCI:

          \`\`\`bash
          sudo bootc switch ${hci_current}
          \`\`\`

          Both container images are signed with the repository Cosign signing key.
          EOF_NOTES

          if gh release view "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            echo "Updating existing release ${release_tag}"

            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            echo "Creating release ${release_tag}"

            gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
